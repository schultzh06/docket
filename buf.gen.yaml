version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/schultzh06/docket/server/gen
plugins:
  - remote: buf.build/protocolbuffers/go
    out: server/gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go
    out: server/gen
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es
    out: apps/tui/src/gen
    opt: 
      - target=ts
      - import_extension=js

